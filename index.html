<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Dao Trung Hieu — Interactive Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        bg: '#050506',
                        panel: '#111113',
                        border: '#2a2a2d',
                        accent: '#4c4c50'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: theme('colors.bg');
            color: white;
            overflow: hidden; /* Prevent scrolling, app-like feel */
        }
        
        .wheel-container {
            transition: all 0.7s cubic-bezier(0.25, 1, 0.5, 1);
        }
        
        /* Layout States */
        .layout-centered .wheel-container {
            transform: translateX(0) scale(1);
        }
        
        .layout-shifted .wheel-container {
            /* Shrinks and moves to the left */
            transform: translateX(-20vw) scale(0.85);
        }

        .detail-panel {
            transition: all 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .layout-centered .detail-panel {
            transform: translateX(100%);
            opacity: 0;
            pointer-events: none;
        }

        .layout-shifted .detail-panel {
            transform: translateX(0);
            opacity: 1;
            pointer-events: auto;
        }

        /* SVG Wheel Animation */
        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }
        
        .spin-slow {
            animation: spin 45s linear infinite;
            transform-origin: center;
        }

        /* Segment Hover Effects */
        .wheel-segment {
            transition: all 0.3s ease;
            cursor: pointer;
            transform-origin: center;
        }

        .wheel-segment:hover {
            filter: brightness(1.3);
            /* Slightly scale up the hovered segment */
            transform: scale(1.02);
        }

        /* Center Content Crossfade */
        .fade-enter {
            opacity: 0;
            transform: scale(0.9);
        }
        .fade-enter-active {
            opacity: 1;
            transform: scale(1);
            transition: opacity 300ms, transform 300ms;
        }
        
        /* Placeholder Image Pattern */
        .img-placeholder {
            background: linear-gradient(45deg, transparent 48%, theme('colors.border') 49%, theme('colors.border') 51%, transparent 52%);
            background-size: 14px 14px;
        }
    </style>
</head>
<body class="w-screen h-screen flex items-center justify-center relative">

    <!-- Background Grid / Texture -->
    <div class="absolute inset-0 pointer-events-none opacity-20" aria-hidden="true">
        <svg width="100%" height="100%">
            <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.5"/>
            </pattern>
            <rect width="100%" height="100%" fill="url(#grid)" />
        </svg>
    </div>

    <div id="app" class="w-full h-full relative flex items-center justify-center layout-centered">
        
        <!-- Left/Center: Wheel Area -->
        <div class="wheel-container absolute w-[800px] h-[800px] flex items-center justify-center z-10">
            
            <!-- Center Info Bubble (Doesn't spin) -->
            <div id="center-bubble" class="absolute z-20 w-[420px] h-[420px] rounded-full bg-panel border-2 border-border flex flex-col items-center justify-center text-center p-8 shadow-2xl backdrop-blur-md bg-opacity-90 transition-all duration-300">
                <!-- Content injected by JS -->
            </div>

            <!-- Rotating SVG Donut Wheel -->
            <svg id="wheel-svg" width="800" height="800" viewBox="0 0 800 800" class="absolute z-0 drop-shadow-2xl">
                <g id="wheel-group" class="spin-slow">
                    <!-- Segments injected by JS -->
                </g>
            </svg>
        </div>

        <!-- Right: Detail Panel (Level 2) -->
        <div class="detail-panel absolute right-0 top-0 h-full w-[40vw] max-w-[600px] bg-panel border-l border-border z-20 shadow-2xl flex flex-col">
            <div class="p-10 flex-1 overflow-y-auto">
                <button id="btn-close-detail" class="mb-8 flex items-center text-sm font-mono text-gray-400 hover:text-white transition-colors">
                    <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                    CLOSE DETAIL
                </button>
                
                <div id="detail-eyebrow" class="font-mono text-xs tracking-widest text-gray-500 mb-3 uppercase"></div>
                <h2 id="detail-title" class="text-3xl font-bold font-sans mb-2"></h2>
                <div id="detail-meta" class="font-mono text-sm text-gray-400 mb-8 pb-4 border-b border-border"></div>
                
                <div class="img-placeholder w-full h-[280px] rounded-xl border border-border mb-8 flex items-center justify-center overflow-hidden relative">
                    <img id="detail-image" src="" alt="" class="w-full h-full object-cover hidden">
                    <span id="detail-image-fallback" class="font-mono text-gray-500 text-sm tracking-widest">+ IMAGE PLACEHOLDER</span>
                </div>
                
                <div id="detail-desc" class="text-gray-300 leading-relaxed font-sans text-sm space-y-4">
                    <!-- Description items -->
                </div>
            </div>
        </div>

    </div>

    <script>
        // --- Mock Data ---
        const data = {
            personal: {
                name: "LE DAO TRUNG HIEU",
                eyebrow: "HIGH SCHOOL · EXPECTED GRAD. 2027",
                tagline: "High school student with a strong academic foundation and a growing passion for physics, electronics, and engineering, aspiring to pursue Electrical and Electronics Engineering.",
                contact: "trunghieu18122009@gmail.com"
            },
            categories: [
                {
                    id: "education",
                    title: "Education",
                    color: "#3B82F6", // Blue
                    items: [
                        { title: "Nguyen Thuong Hien High School", meta: "Expected 2027", desc: ["Grade 11 GPA: 9.4/10 (2026)", "Grade 10 GPA: 9.0/10 (2025)"] },
                        { title: "Tran Quang Khai Middle School", meta: "Graduated 2024", desc: ["Grade 9 GPA: 9.2/10"] }
                    ]
                },
                {
                    id: "tests",
                    title: "Tests",
                    color: "#8B5CF6", // Purple
                    items: [
                        { title: "IELTS - 7.5", meta: "Academic", desc: ["Reading: 8.5", "Listening: 8.0", "Writing: 6.5", "Speaking: 6.0"] },
                        { title: "SAT - 1460", meta: "Composite", desc: ["Verbal: 680", "Math: 780"] }
                    ]
                },
                {
                    id: "honors",
                    title: "Honors",
                    color: "#F59E0B", // Amber
                    items: [
                        { title: "IAMO - Mathematics", meta: "Final Round · 2026", desc: ["Qualified for the Final Round of IAMO 2026 after successfully advancing through the preliminary round."] },
                        { title: "IACHO - Chemistry", meta: "Final Round · 2026", desc: ["Passed the Preliminary and Semi-Final Rounds of the International Applied Chemistry Olympiad (IACHO) 2026 and was officially selected for the Final Round in Indonesia."] },
                        { title: "ASMO - Science", meta: "Final Round · 2026", desc: ["To be determined."] }
                    ]
                },
                {
                    id: "leadership",
                    title: "Leadership",
                    color: "#10B981", // Emerald
                    items: [
                        { title: "Mid-Autumn - Se Dang", meta: "Project Leader · 2026", desc: ["Led a Mid-Autumn Festival initiative serving more than 650 children in a Se Dang ethnic minority community.", "Coordinated volunteers, budgeting, logistics, meals, and activities."] },
                        { title: "Ánh Bình Minh", meta: "Project Member · 2026", desc: ["Contributed to an initiative expanding access to educational support for ethnic minority students in the Central Highlands."] },
                        { title: "Gia Lai Mobile Clinic", meta: "Volunteer · 2026", desc: ["Supported online communications and recurring mobile-clinic activities providing healthcare services."] },
                        { title: "Red Flamboyant", meta: "Participant · 2026", desc: ["Supported local ward activities, summer programs for children, and community-service initiatives."] }
                    ]
                },
                {
                    id: "stem",
                    title: "STEM",
                    color: "#EF4444", // Red
                    items: [
                        { title: "Student Focus Project", meta: "Founder · 2026-Present", desc: ["Developing an independent project exploring concentration and attention during studying."] },
                        { title: "Solve for Tomorrow", meta: "National · 2026", desc: ["Completed a STEM innovation program covering design thinking, AI, IoT, and problem-solving."] },
                        { title: "Intro to Devices", meta: "KAIST · 2026", desc: ["Studied semiconductor devices, electronic components, and fundamental engineering concepts."] },
                        { title: "Intro Programming", meta: "Microsoft · 2026", desc: ["Studied coding fundamentals, algorithms, problem-solving."] },
                        { title: "Water Rocket", meta: "Team Member · 2025", desc: ["Designed, built, and tested a water rocket, using iterative testing to improve flight performance."] }
                    ]
                },
                {
                    id: "activities",
                    title: "Activities",
                    color: "#EC4899", // Pink
                    items: [
                        { title: "Cheerleading Team", meta: "Team Member · 2025", desc: ["Performed at school athletic events and developed teamwork, discipline, and performance skills."] },
                        { title: "Dance Competition", meta: "Performer · 2025", desc: ["Represented the class in the annual dance competition."] },
                        { title: "CMD Education Fair", meta: "Student Leader · 2026", desc: ["Supported event organization and coordination; received a Certificate of Appreciation."] }
                    ]
                }
            ]
        };

        // --- Application State ---
        let state = {
            level: 0, // 0: Home, 1: Category Selected, 2: Item Selected
            category: null,
            item: null
        };

        // DOM Elements
        const appContainer = document.getElementById('app');
        const wheelGroup = document.getElementById('wheel-group');
        const centerBubble = document.getElementById('center-bubble');
        
        // Detail Panel Elements
        const detailEyebrow = document.getElementById('detail-eyebrow');
        const detailTitle = document.getElementById('detail-title');
        const detailMeta = document.getElementById('detail-meta');
        const detailDesc = document.getElementById('detail-desc');
        const btnCloseDetail = document.getElementById('btn-close-detail');

        // SVG Constants
        const SVG_SIZE = 800;
        const CENTER_X = SVG_SIZE / 2;
        const CENTER_Y = SVG_SIZE / 2;
        const RADIUS_OUTER = 380;
        const RADIUS_INNER = 230; // Creates the donut hole for the center bubble

        /**
         * Calculates X,Y coordinates for a point on a circle
         */
        function getCoordinatesForPercent(percent, radius) {
            // Subtract PI/2 to start at the top (12 o'clock)
            const angle = (percent * 2 * Math.PI) - (Math.PI / 2);
            return [
                CENTER_X + Math.cos(angle) * radius,
                CENTER_Y + Math.sin(angle) * radius
            ];
        }

        /**
         * Generates the SVG path 'd' attribute for a donut segment
         */
        function createArcPath(startPercent, endPercent) {
            const [startX_outer, startY_outer] = getCoordinatesForPercent(startPercent, RADIUS_OUTER);
            const [endX_outer, endY_outer] = getCoordinatesForPercent(endPercent, RADIUS_OUTER);
            
            const [startX_inner, startY_inner] = getCoordinatesForPercent(startPercent, RADIUS_INNER);
            const [endX_inner, endY_inner] = getCoordinatesForPercent(endPercent, RADIUS_INNER);
            
            // If the arc is > 50% of the circle, use large-arc-flag
            const largeArcFlag = endPercent - startPercent > 0.5 ? 1 : 0;

            return [
                `M ${startX_inner} ${startY_inner}`,
                `L ${startX_outer} ${startY_outer}`,
                `A ${RADIUS_OUTER} ${RADIUS_OUTER} 0 ${largeArcFlag} 1 ${endX_outer} ${endY_outer}`,
                `L ${endX_inner} ${endY_inner}`,
                `A ${RADIUS_INNER} ${RADIUS_INNER} 0 ${largeArcFlag} 0 ${startX_inner} ${startY_inner}`,
                'Z'
            ].join(' ');
        }

        /**
         * Truncate text for SVG display
         */
        function truncate(text, length) {
            return text.length > length ? text.substring(0, length) + '...' : text;
        }

        function renderWheel(items, isCategoryLevel) {
            wheelGroup.innerHTML = '';
            const numItems = items.length;
            const gap = 0.005; // Small visual gap between slices

            items.forEach((item, index) => {
                const startPercent = (index / numItems) + gap;
                const endPercent = ((index + 1) / numItems) - gap;
                const midPercent = (startPercent + endPercent) / 2;
                
                // Color mapping: Use category color if at level 1, otherwise use a generated/assigned color
                let segmentColor = item.color;
                if (!isCategoryLevel && state.category) {
                    // Slight variation of category color for items
                    segmentColor = state.category.color;
                }

                // Create a group for the segment
                const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                g.classList.add('wheel-segment');
                g.style.transformOrigin = `${CENTER_X}px ${CENTER_Y}px`;
                
                // Segment Path
                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.setAttribute('d', createArcPath(startPercent, endPercent));
                path.setAttribute('fill', segmentColor);
                path.setAttribute('fill-opacity', isCategoryLevel ? '0.85' : '0.6');
                path.setAttribute('stroke', '#2a2a2d');
                path.setAttribute('stroke-width', '2');
                
                // Hover gradient/highlight effect using CSS handled in classes, but we can set base styles
                
                // Segment Text
                const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                const textRadius = (RADIUS_INNER + RADIUS_OUTER) / 2; // Place text in middle of slice
                const [textX, textY] = getCoordinatesForPercent(midPercent, textRadius);
                
                // Calculate rotation for text so it points outwards
                let angleDeg = midPercent * 360;
                // Keep text readable (prevent upside down text on the left side)
                let rotateAngle = angleDeg - 90;
                if (angleDeg > 180) {
                    rotateAngle += 180;
                }

                text.setAttribute('x', textX);
                text.setAttribute('y', textY);
                text.setAttribute('fill', '#ffffff');
                text.setAttribute('font-family', 'Inter, sans-serif');
                text.setAttribute('font-weight', '600');
                text.setAttribute('font-size', isCategoryLevel ? '18px' : '14px');
                text.setAttribute('text-anchor', 'middle');
                text.setAttribute('dominant-baseline', 'middle');
                text.setAttribute('transform', `rotate(${rotateAngle}, ${textX}, ${textY})`);
                text.textContent = truncate(item.title, isCategoryLevel ? 20 : 15);

                g.appendChild(path);
                g.appendChild(text);

                // Interaction
                g.addEventListener('click', () => {
                    if (isCategoryLevel) {
                        handleCategoryClick(item);
                    } else {
                        handleItemClick(item);
                    }
                });

                wheelGroup.appendChild(g);
            });
        }

        function updateCenterBubble() {
            // Apply fade transition
            centerBubble.classList.remove('fade-enter-active');
            centerBubble.classList.add('fade-enter');
            
            setTimeout(() => {
                if (state.level === 0) {
                    // Personal Info
                    centerBubble.innerHTML = `
                        <div class="font-mono text-[0.65rem] tracking-[0.2em] text-accent mb-4 uppercase border border-border px-3 py-1 rounded-full">${data.personal.eyebrow}</div>
                        <h1 class="text-3xl font-bold font-mono tracking-tight text-white mb-4 leading-tight">${data.personal.name}</h1>
                        <p class="text-gray-400 text-sm mb-6 font-sans leading-relaxed">${data.personal.tagline}</p>
                        <div class="font-mono text-xs text-gray-500 border-t border-border pt-4 w-full">
                            ${data.personal.contact}
                        </div>
                    `;
                } else {
                    // Category Info + Back Button
                    const category = state.category;
                    centerBubble.innerHTML = `
                        <div class="w-16 h-16 rounded-full mb-4 flex items-center justify-center border-4 border-panel" style="background-color: ${category.color}">
                            <!-- Icon placeholder -->
                            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                        </div>
                        <h2 class="text-3xl font-bold font-mono tracking-tight text-white mb-2 uppercase">${category.title}</h2>
                        <p class="text-gray-400 font-mono text-sm mb-8">${category.items.length} Achievements</p>
                        
                        <button onclick="goBack()" class="px-6 py-2 rounded-full border border-border bg-transparent hover:bg-white hover:text-black transition-colors font-mono text-xs tracking-widest uppercase flex items-center">
                            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                            BACK
                        </button>
                    `;
                }
                
                // Trigger reflow and fade in
                void centerBubble.offsetWidth;
                centerBubble.classList.remove('fade-enter');
                centerBubble.classList.add('fade-enter-active');
            }, 150); // wait for fade out
        }

        function updateDetailPanel() {
            if (!state.item || !state.category) return;
            
            detailEyebrow.textContent = state.category.title;
            detailEyebrow.style.color = state.category.color;
            detailTitle.textContent = state.item.title;
            detailMeta.textContent = state.item.meta;
            
            detailDesc.innerHTML = '';
            state.item.desc.forEach(p => {
                const pEl = document.createElement('p');
                pEl.className = "flex items-start";
                pEl.innerHTML = `<span class="mr-3 text-accent mt-1">▹</span> <span>${p}</span>`;
                detailDesc.appendChild(pEl);
            });
        }

        function handleCategoryClick(category) {
            state.level = 1;
            state.category = category;
            state.item = null;
            
            updateCenterBubble();
            renderWheel(category.items, false);
            updateLayout();
        }

        function handleItemClick(item) {
            state.level = 2;
            state.item = item;
            
            updateDetailPanel();
            updateLayout();
        }

        function goBack() {
            if (state.level === 2) {
                // From Item Detail back to Category Items
                state.level = 1;
                state.item = null;
                updateLayout();
                // Wheel is already showing category items, no need to re-render wheel
            } else if (state.level === 1) {
                // From Category back to Home
                state.level = 0;
                state.category = null;
                updateCenterBubble();
                renderWheel(data.categories, true);
                updateLayout();
            }
        }

        function updateLayout() {
            if (state.level === 2) {
                appContainer.classList.remove('layout-centered');
                appContainer.classList.add('layout-shifted');
            } else {
                appContainer.classList.remove('layout-shifted');
                appContainer.classList.add('layout-centered');
            }
        }

        // Event Listeners
        btnCloseDetail.addEventListener('click', goBack);
        
        // Allow clicking background in Level 2 to go back
        appContainer.addEventListener('click', (e) => {
            if (state.level === 2 && !e.target.closest('.detail-panel') && !e.target.closest('#wheel-svg')) {
                goBack();
            }
        });

        // Initialize App
        function init() {
            state.level = 0;
            updateCenterBubble();
            renderWheel(data.categories, true);
            updateLayout();
        }

        window.onload = init;
    </script>
</body>
</html>
