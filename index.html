<!DOCTYPE html>

<script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','sans-serif'],mono:['JetBrains Mono','monospace']},colors:{bg:'#050506',panel:'#111113',border:'#2a2a2d',accent:'#4c4c50'}}}};</script>
<style>
body{background:#050506;color:#f2f2f2;overflow:hidden}.wheel-stage{transition:transform .7s cubic-bezier(.22,1,.36,1),opacity .5s ease}.layout-centered .wheel-stage{transform:translateX(0) scale(1)}.layout-shifted .wheel-stage{transform:translateX(-22vw) scale(.78)}.detail-panel{transition:transform .6s cubic-bezier(.22,1,.36,1),opacity .5s ease}.layout-centered .detail-panel{transform:translateX(100%);opacity:0;pointer-events:none}.layout-shifted .detail-panel{transform:translateX(0);opacity:1;pointer-events:auto}@keyframes wheel-spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}.spin-continuous{animation:wheel-spin 50s linear infinite;transform-origin:400px 400px}.wheel-segment{cursor:pointer;transition:filter .3s ease}.wheel-segment:hover{filter:brightness(1.25) drop-shadow(0 0 12px rgba(255,255,255,.2))}.item-label{pointer-events:none;user-select:none}.custom-scroll::-webkit-scrollbar{width:5px}.custom-scroll::-webkit-scrollbar-track{background:#111113}.custom-scroll::-webkit-scrollbar-thumb{background:#2a2a2d;border-radius:4px}.img-placeholder-pattern{background:linear-gradient(45deg,transparent 48%,#2a2a2d 49%,#2a2a2d 51%,transparent 52%);background-size:12px 12px}
</style>
</head>
<body class="w-screen h-screen min-h-[700px] flex items-center justify-center relative font-sans bg-bg">
<div class="fixed inset-0 pointer-events-none opacity-20 z-0"><svg width="100%" height="100%"><pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M 50 0 L 0 0 0 50" fill="none" stroke="#ffffff" stroke-width="0.5"/></pattern><rect width="100%" height="100%" fill="url(#grid)"/></svg></div>
<div id="app-viewport" class="w-full h-full relative flex items-center justify-center layout-centered z-10">
<div class="wheel-stage absolute w-[800px] h-[800px] flex items-center justify-center flex-shrink-0">
<div id="center-hub" class="absolute z-20 w-[420px] h-[420px] rounded-full bg-panel border border-border flex flex-col items-center justify-center text-center p-8 shadow-2xl backdrop-blur-md bg-opacity-95"></div>
<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" class="absolute z-10 drop-shadow-2xl"><g id="wheel-group" class="spin-continuous"></g></svg>
</div>
<div class="detail-panel absolute right-0 top-0 h-full w-[90vw] sm:w-[450px] md:w-[500px] bg-panel border-l border-border z-30 shadow-2xl flex flex-col"><div class="p-6 md:p-8 flex-1 overflow-y-auto custom-scroll">
<button id="btn-back-detail" class="mb-6 inline-flex items-center text-xs font-mono text-gray-400 hover:text-white transition-colors bg-bg/50 px-3 py-1.5 rounded-full border border-border"><svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>QUAY LẠI</button>
<div id="detail-category-badge" class="font-mono text-[11px] tracking-widest uppercase text-gray-400 mb-2"></div><h2 id="detail-item-title" class="text-2xl font-bold font-sans text-white mb-2 leading-snug"></h2><div id="detail-item-meta" class="font-mono text-xs text-gray-400 mb-6 pb-4 border-b border-border"></div>
<div class="w-full h-[220px] rounded-lg border border-border mb-6 flex items-center justify-center overflow-hidden relative bg-bg img-placeholder-pattern"><img id="detail-image" src="" alt="Detail Image" class="w-full h-full object-cover hidden" onerror="this.classList.add('hidden');document.getElementById('detail-image-fallback').classList.remove('hidden');"><iframe id="detail-pdf" src="" title="PDF Preview" class="w-full h-full hidden border-0 bg-white"></iframe><div id="detail-image-fallback" class="font-mono text-gray-500 text-xs tracking-wider flex flex-col items-center gap-1"><svg class="w-6 h-6 opacity-40" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg><span>[ KHUNG ẢNH TRỐNG ]</span></div></div>
<div id="detail-description" class="space-y-3 text-sm text-gray-300 font-sans leading-relaxed"></div>
</div></div></div>
<script>
const portfolioData={personal:{name:'LE DAO TRUNG HIEU',eyebrow:'HIGH SCHOOL · GRADUATION 2027',tagline:'High school student with a strong academic foundation and passion for physics, electronics, and engineering, aspiring to pursue Electrical & Electronics Engineering.',location:'Ho Chi Minh City, Vietnam',phone:'+84 989 415 751',email:'trunghieu18122009@gmail.com',skills:['Physics','Electronics','Mathematics','AI / Data','Cheerleading','Community Service']},categories:[
{id:'education',title:'Education',color:'#2563EB',items:[{title:'Nguyen Thuong Hien High School',meta:'Class of 2027',image:'',desc:['Grade 11 GPA: 9.4 / 10 (2026)','Grade 10 GPA: 9.0 / 10 (2025)','Focused on Physics, Advanced Mathematics, and STEM activities.']},{title:'Tran Quang Khai Middle School',meta:'Graduated 2024',image:'',desc:['Grade 9 GPA: 9.2 / 10','Consistently recognized as an outstanding academic achiever.']}]},
{id:'tests',title:'Standardized Tests',color:'#7C3AED',items:[{title:'IELTS Academic — 7.5',meta:'Official Score',image:'',desc:['Reading: 8.5 | Listening: 8.0','Writing: 6.5 | Speaking: 6.0','Demonstrated high English fluency for academic research.']},{title:'SAT — 1460',meta:'Composite Score',image:'',desc:['Math Section: 780 / 800','Reading & Writing Section: 680 / 800']}]},
{id:'honors',title:'Honors & Awards',color:'#D97706',items:[{title:'IAMO — Mathematics',meta:'Final Round · 2026',image:'images/IAMO.JPG',desc:['Qualified for the Final Round of IAMO 2026 after advancing through rigorous preliminary rounds.','Demonstrated strong logical reasoning and mathematical problem-solving.']},{title:'IACHO — Chemistry',meta:'Final Round · Bandung, Indonesia · 2026',image:'images/LOA.png',desc:['Selected for the International Final Round of International Applied Chemistry Olympiad (IACHO) 2026.','Participating in Bandung, Indonesia (Sept 24–27, 2026).']},{title:'ASMO — Science',meta:'Final Round · 2026',image:'',desc:['Asian Science and Mathematics Olympiad participant.','Results to be finalized.']}]},
{id:'leadership',title:'Leadership & Community',color:'#059669',items:[{title:'Mid-Autumn Festival — Se Dang',meta:'Project Leader · 2026',image:'',desc:['Led a Mid-Autumn initiative serving over 650 children in a Se Dang ethnic minority community.','Coordinated volunteers, budgeting, logistics, meals, and educational activities.']},{title:'Ánh Bình Minh Tây Nguyên',meta:'Project Member · 2026',image:'',desc:['Contributed to expanding educational support for ethnic minority students in Central Highlands (Ede & Jarai communities).']},{title:'Gia Lai Mobile Clinic',meta:'Volunteer · 2026',image:'',desc:['Supported online communications & healthcare assistance for local minority villages.']},{title:'Red Flamboyant Campaign',meta:'Participant · 2026',image:'images/HPD.jpg',desc:['Supported summer youth programs, ward activities, and charitable local services.']},{title:'Smiling Chances',meta:'Volunteer · 2026',image:'images/Smiling chances.png',desc:['Participated in community outreach and charitable fundraising programs.']}]},
{id:'stem',title:'STEM & Research',color:'#DC2626',items:[{title:'Student Focus & Attention',meta:'Founder · 2026–Present',image:'',desc:['Developing an independent research project exploring student concentration methods during study.']},{title:'Samsung Solve for Tomorrow',meta:'National Participant · 2026',image:'images/Solve for tomorrow.JPG',desc:['Completed STEM innovation training covering Design Thinking, AI, IoT, and community problem-solving.']},{title:'Intro to Semiconductor Devices',meta:'KAIST · 2026',image:'images/KAIST.pdf',desc:['Studied semiconductor devices, electronic components, and fundamental engineering concepts.']},{title:'Introductory Programming',meta:'Microsoft · 2026',image:'images/Microsoft.pdf',desc:['Mastered core algorithms, coding logic, and basic software development concepts.']},{title:'Introductory Data Course',meta:'Google · 2026',image:'images/Google.pdf',desc:['Studied data analytics processes, data structure basics, and quantitative thinking.']},{title:'Water Rocket Competition',meta:'Team Member · 2025',image:'',desc:['Designed, constructed, and launched pressurized water rockets using iterative aerodynamics testing.']}]},
{id:'activities',title:'School & Activities',color:'#DB2777',items:[{title:'Lightning Cheerleading Team',meta:'Team Member · 2025',image:'',desc:['Performed at major school athletic events and honed physical coordination & teamwork.']},{title:'Annual Dance Competition',meta:'Performer · 2025',image:'',desc:['Represented class in choreographed performances for the annual festival.']},{title:'CMD Education Fair',meta:'Student Leader · 2026',image:'images/CMD.png',desc:['Organized and facilitated logistics; awarded Certificate of Appreciation for leadership.']}]}
]};
let appState={level:0,currentCategory:null,currentItem:null};
const centerHub=document.getElementById('center-hub'),wheelGroup=document.getElementById('wheel-group'),appViewport=document.getElementById('app-viewport'),btnBackDetail=document.getElementById('btn-back-detail');
const detailCategoryBadge=document.getElementById('detail-category-badge'),detailItemTitle=document.getElementById('detail-item-title'),detailItemMeta=document.getElementById('detail-item-meta'),detailImage=document.getElementById('detail-image'),detailPdf=document.getElementById('detail-pdf'),detailImageFallback=document.getElementById('detail-image-fallback'),detailDescription=document.getElementById('detail-description');
const CENTER=400,R_OUTER=380,R_INNER=225;
function polarToCartesian(cx,cy,r,a){const rad=(a-90)*Math.PI/180;return{x:cx+r*Math.cos(rad),y:cy+r*Math.sin(rad)}}
function createDonutArc(startAngle,endAngle){const so=polarToCartesian(CENTER,CENTER,R_OUTER,startAngle),eo=polarToCartesian(CENTER,CENTER,R_OUTER,endAngle),si=polarToCartesian(CENTER,CENTER,R_INNER,startAngle),ei=polarToCartesian(CENTER,CENTER,R_INNER,endAngle),large=endAngle-startAngle<=180?'0':'1';return['M',so.x,so.y,'A',R_OUTER,R_OUTER,0,large,1,eo.x,eo.y,'L',ei.x,ei.y,'A',R_INNER,R_INNER,0,large,0,si.x,si.y,'Z'].join(' ')}
function renderCenterHub(){if(appState.level===0){const p=portfolioData.personal;centerHub.innerHTML=`<span class="font-mono text-[10px] tracking-[0.2em] text-gray-400 uppercase border border-border px-3 py-1 rounded-full mb-3">${p.eyebrow}</span><h1 class="text-2xl font-bold font-mono text-white mb-2 tracking-tight">${p.name}</h1><p class="text-xs text-gray-300 font-sans line-clamp-3 mb-4 max-w-[340px] leading-relaxed">${p.tagline}</p><div class="w-full border-t border-border pt-3 mt-1 flex flex-col gap-1 text-[11px] font-mono text-gray-400"><div>📍 ${p.location}</div><div>✉️ ${p.email} | 📞 ${p.phone}</div></div><div class="mt-3 flex flex-wrap justify-center gap-1 max-w-[320px]">${p.skills.map(s=>`<span class="text-[9px] font-mono bg-bg border border-border text-gray-300 px-2 py-0.5 rounded">${s}</span>`).join('')}</div>`}else{const cat=appState.currentCategory;centerHub.innerHTML=`<div class="w-12 h-12 rounded-full mb-3 flex items-center justify-center text-white font-mono text-lg font-bold border-2 border-panel shadow-md" style="background-color:${cat.color}">${cat.title.charAt(0)}</div><span class="font-mono text-[10px] tracking-widest text-gray-500 uppercase mb-1">MỤC ĐÃ CHỌN</span><h2 class="text-2xl font-bold font-mono text-white mb-1 uppercase tracking-wide">${cat.title}</h2><span class="text-xs font-mono text-gray-400 mb-6">${cat.items.length} thành tích / mục</span><button id="btn-back-home" class="px-5 py-2 rounded-full border border-border bg-bg hover:bg-white hover:text-black transition-all text-xs font-mono font-semibold tracking-wider flex items-center gap-2"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>TRỞ VỀ TRANG CHỦ</button>`;document.getElementById('btn-back-home').addEventListener('click',e=>{e.stopPropagation();goHome()})}}
function renderWheelSegments(){wheelGroup.innerHTML='';const isCategoryLevel=appState.level===0,items=isCategoryLevel?portfolioData.categories:appState.currentCategory.items,count=items.length;if(!count)return;const anglePerSegment=360/count,gap=count>1?1.5:0;textCounter=0;items.forEach((item,index)=>{const startAngle=index*anglePerSegment+gap/2,endAngle=(index+1)*anglePerSegment-gap/2,midAngle=(startAngle+endAngle)/2,g=document.createElementNS('http://www.w3.org/2000/svg','g');g.classList.add('wheel-segment');const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',createDonutArc(startAngle,endAngle));path.setAttribute('fill',isCategoryLevel?item.color:appState.currentCategory.color);path.setAttribute('fill-opacity',isCategoryLevel?'0.85':'0.65');path.setAttribute('stroke','#2a2a2d');path.setAttribute('stroke-width','1.5');
const textRadius=(R_INNER+R_OUTER)/2;
    const labelPos=polarToCartesian(CENTER,CENTER,textRadius,midAngle);
    
    // Place each label at the segment midpoint and rotate it along the
    // tangent. Normalize the rotation so every label stays readable.
    let textRotation=midAngle;
    if(midAngle>90 && midAngle<270) textRotation+=180;
    
    const text=document.createElementNS('http://www.w3.org/2000/svg','text');
    text.classList.add('item-label');
    text.setAttribute('x',labelPos.x);
    text.setAttribute('y',labelPos.y);
    text.setAttribute('transform',`rotate(${textRotation} ${labelPos.x} ${labelPos.y})`);
    text.setAttribute('text-anchor','middle');
    text.setAttribute('dominant-baseline','middle');
    text.setAttribute('fill','#ffffff');
    text.setAttribute('font-family','Inter, sans-serif');
    text.setAttribute('font-weight','600');
    text.setAttribute('font-size',isCategoryLevel?'14px':'11px');
    text.setAttribute('letter-spacing',isCategoryLevel?'0.2px':'0px');
    
    let titleText=item.title;
    const maxLength=isCategoryLevel?24:32;
    if(titleText.length>maxLength) titleText=titleText.substring(0,maxLength-2).trimEnd()+'..';
    text.textContent=titleText;
    
    g.append(path, text);
                g.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (isCategoryLevel) {
                        selectCategory(item);
                    } else {
                        selectItem(item);
                    }
                });
                wheelGroup.appendChild(g);
            });
        }

function selectCategory(category){appState.level=1;appState.currentCategory=category;appState.currentItem=null;renderCenterHub();renderWheelSegments();updateLayoutClass()}
function selectItem(item){appState.level=2;appState.currentItem=item;detailCategoryBadge.textContent=appState.currentCategory.title;detailCategoryBadge.style.color=appState.currentCategory.color;detailItemTitle.textContent=item.title;detailItemMeta.textContent=item.meta;detailImage.classList.add('hidden');detailPdf.classList.add('hidden');detailImageFallback.classList.remove('hidden');detailImage.src='';detailPdf.src='';if(item.image){const media=item.image.trim();if(media.toLowerCase().endsWith('.pdf')){detailPdf.src=media;detailPdf.classList.remove('hidden');detailImageFallback.classList.add('hidden')}else{detailImage.src=media;detailImage.classList.remove('hidden');detailImageFallback.classList.add('hidden')}}detailDescription.innerHTML='';item.desc.forEach(b=>{const li=document.createElement('div');li.className='flex items-start gap-2.5';li.innerHTML=`<span class="text-gray-400 mt-0.5">•</span><span>${b}</span>`;detailDescription.appendChild(li)});updateLayoutClass()}
function goHome(){appState={level:0,currentCategory:null,currentItem:null};renderCenterHub();renderWheelSegments();updateLayoutClass()}
function updateLayoutClass(){appViewport.classList.toggle('layout-shifted',appState.level===2);appViewport.classList.toggle('layout-centered',appState.level!==2)}
btnBackDetail.addEventListener('click',()=>{if(appState.level===2){appState.level=1;appState.currentItem=null;updateLayoutClass()}});
document.addEventListener('click',e=>{if(appState.level===2&&!e.target.closest('.detail-panel')&&!e.target.closest('.wheel-segment')){appState.level=1;appState.currentItem=null;updateLayoutClass()}});
window.addEventListener('load',()=>{renderCenterHub();renderWheelSegments();updateLayoutClass()});
</script></body></html>
