        body {

        }

        .wheel-stage {
            transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.5s ease;
        }

        /* Layout State Transitions */
        .layout-centered .wheel-stage {
            transform: translateX(0) scale(1);
        }

        .layout-shifted .wheel-stage {
            /* Shrink wheel and slide left when detail panel opens */
            transform: translateX(-22vw) scale(0.78);
        }

        .detail-panel {
            transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.5s ease;
        }

        .layout-centered .detail-panel {
            transform: translateX(100%);
            opacity: 0;
            pointer-events: none;
        }

        .layout-shifted .detail-panel {
            transform: translateX(0);
            opacity: 1;
            pointer-events: auto;
        }

        /* Continuous Wheel Spin */
        @keyframes wheel-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .spin-continuous {
            animation: wheel-spin 50s linear infinite !important;
            transform-origin: 400px 400px;
        }

        /* Donut Segment Styles */
        .wheel-segment {
            cursor: pointer;
            transition: filter 0.3s ease, transform 0.3s ease;
            transform-origin: 400px 400px;

        // Geometry Constants for SVG Donut
        const CENTER = 400;
        const R_OUTER = 380;
        const R_INNER = 225; // Leaves space for 420px center hub

        function polarToCartesian(cx, cy, r, angleInDegrees) {
            const angleInRadians = (angleInDegrees - 90) * Math.PI / 180.0;
            return {
                x: cx + (r * Math.cos(angleInRadians)),
                y: cy + (r * Math.sin(angleInRadians))
            };
        }

        function createDonutArc(startAngle, endAngle) {
            const startOuter = polarToCartesian(CENTER, CENTER, R_OUTER, startAngle);
            const endOuter = polarToCartesian(CENTER, CENTER, R_OUTER, endAngle);
            const startInner = polarToCartesian(CENTER, CENTER, R_INNER, startAngle);
            const endInner = polarToCartesian(CENTER, CENTER, R_INNER, endAngle);

            const largeArcFlag = endAngle - startAngle <= 180 ? "0" : "1";

            return [
                "M", startOuter.x, startOuter.y,
                "A", R_OUTER, R_OUTER, 0, largeArcFlag, 1, endOuter.x, endOuter.y,
                "L", endInner.x, endInner.y,
                "A", R_INNER, R_INNER, 0, largeArcFlag, 0, startInner.x, startInner.y,
                "Z"
            ].join(" ");
        }

        function renderWheelSegments() {
            wheelGroup.innerHTML = '';
            
            const isCategoryLevel = (appState.level === 0);
            const items = isCategoryLevel ? portfolioData.categories : appState.currentCategory.items;
            const count = items.length;
            if (count === 0) return;

            const anglePerSegment = 360 / count;
            const gap = count > 1 ? 1.5 : 0; // Degree gap between slices

            items.forEach((item, index) => {
                const startAngle = (index * anglePerSegment) + (gap / 2);
                const endAngle = ((index + 1) * anglePerSegment) - (gap / 2);
                const midAngle = (startAngle + endAngle) / 2;

                const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                g.classList.add('wheel-segment');

                // Donut Slice Path
                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.setAttribute('d', createDonutArc(startAngle, endAngle));
                
                const color = isCategoryLevel ? item.color : appState.currentCategory.color;
                path.setAttribute('fill', color);
                path.setAttribute('fill-opacity', isCategoryLevel ? '0.85' : '0.65');
                path.setAttribute('stroke', '#2a2a2d');
                path.setAttribute('stroke-width', '1.5');

                // ============================================================
                // CURVED LABEL — chữ chạy theo cung tròn của từng ô
                // ============================================================

                const textRadius = (R_INNER + R_OUTER) / 2;

                // Độ rộng cung dành cho chữ
                const segmentAngle = anglePerSegment;
                const paddingAngle = isCategoryLevel ? 7 : 5;

                let arcStart = midAngle - (segmentAngle / 2) + paddingAngle;
                let arcEnd   = midAngle + (segmentAngle / 2) - paddingAngle;

                // Nếu chữ nằm ở nửa dưới donut,
                // đảo chiều cung để chữ vẫn luôn đọc đúng chiều.
                const upsideDown = midAngle > 90 && midAngle < 270;
            
                if (upsideDown) {
                 [arcStart, arcEnd] = [arcEnd, arcStart];
                }

                const start = polarToCartesian(
                CENTER,
                CENTER,
                textRadius,
                 arcStart
                );

                const end = polarToCartesian(
                CENTER,
                CENTER,
                textRadius,
                arcEnd
                );

                // ID riêng cho đường dẫn chữ
                const pathId = `text-path-${appState.level}-${index}`;

                // Đường tròn ẩn để textPath bám vào
                const textCurve = document.createElementNS(
                    'http://www.w3.org/2000/svg',
                    'path'
                );

                textCurve.setAttribute('id', pathId);

                textCurve.setAttribute(
                    'd',
                    `M ${start.x} ${start.y}
                     A ${textRadius} ${textRadius} 0 0 ${upsideDown ? 0 : 1}
                     ${end.x} ${end.y}`
                );

                textCurve.setAttribute('fill', 'none');
                textCurve.setAttribute('stroke', 'none');

                // Text
                const text = document.createElementNS(
                    'http://www.w3.org/2000/svg',
                    'text'
                );

                text.classList.add('item-label');
                text.setAttribute('fill', '#ffffff');
                text.setAttribute('font-family', 'Inter, sans-serif');
                text.setAttribute('font-weight', '600');
                text.setAttribute(
                  'font-size',
                isCategoryLevel ? '14px' : '11px'
                );
                text.setAttribute(
                    'letter-spacing',
                    isCategoryLevel ? '0.2px' : '0px'
                );

                // TextPath
                const textPath = document.createElementNS(
                   'http://www.w3.org/2000/svg',
                    'textPath'
                );

                textPath.setAttribute(
                    'href',
                    `#${pathId}`
                );

                textPath.setAttribute(
                    'startOffset',
                    '50%'
                );

                textPath.setAttribute(
                    'text-anchor',
                'middle'
                );

                // Giới hạn title để không đè sang ô kế bên
                let titleText = item.title;
        
                const maxLength = isCategoryLevel ? 24 : 32;

                 if (titleText.length > maxLength) {
                    titleText =
                        titleText.substring(0, maxLength - 2).trimEnd() + '..';
                }

                textPath.textContent = titleText;

                text.appendChild(textPath);

                // Thêm vào group
                g.appendChild(path);
                g.appendChild(textCurve);
                g.appendChild(text);

                // Click Actions
                g.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (isCategoryLevel) {
                        selectCategory(item);
                    } else {
                        selectItem(item);
                    }
                });

                wheelGroup.appendChild(g);
            });
        }

        function selectCategory(category) {
            appState.level = 1;
            appState.currentCategory = category;
            appState.currentItem = null;

            renderCenterHub();
            renderWheelSegments();
            updateLayoutClass();
        }

        function selectItem(item) {
            appState.level = 2;
            appState.currentItem = item;

            // Populate detail panel
            detailCategoryBadge.textContent = appState.currentCategory.title;
            detailCategoryBadge.style.color = appState.currentCategory.color;
            detailItemTitle.textContent = item.title;
            detailItemMeta.textContent = item.meta;

            // Handle Image loading
            if (item.image && item.image.trim() !== '') {
                detailImage.src = item.image;
                detailImage.classList.remove('hidden');
                detailImageFallback.classList.add('hidden');
            } else {
                detailImage.classList.add('hidden');
                detailImageFallback.classList.remove('hidden');
            }

            // Description bullets
            detailDescription.innerHTML = '';
            item.desc.forEach(bullet => {
                const li = document.createElement('div');
                li.className = 'flex items-start gap-2.5';
                li.innerHTML = `<span class="text-gray-400 mt-0.5">•</span><span>${bullet}</span>`;
                detailDescription.appendChild(li);
            });

            updateLayoutClass();
        }

        function goHome() {
            appState.level = 0;
            appState.currentCategory = null;
            appState.currentItem = null;

            renderCenterHub();
            renderWheelSegments();
            updateLayoutClass();
        }

        function updateLayoutClass() {
            if (appState.level === 2) {
                appViewport.classList.remove('layout-centered');
                appViewport.classList.add('layout-shifted');
            } else {
                appViewport.classList.remove('layout-shifted');
                appViewport.classList.add('layout-centered');
            }
        }

        btnBackDetail.addEventListener('click', () => {
            if (appState.level === 2) {
                appState.level = 1;
                appState.currentItem = null;
                updateLayoutClass();
            }
        });

        // Click outside detail panel to return to level 1
        document.addEventListener('click', (e) => {
            if (appState.level === 2 && !e.target.closest('.detail-panel') && !e.target.closest('.wheel-segment')) {
                appState.level = 1;
                appState.currentItem = null;
                updateLayoutClass();
            }
        });

        // Initialize application on page load
        window.onload = function() {
            renderCenterHub();
            renderWheelSegments();
            updateLayoutClass();
        };
    </script>
</body>
</html>
